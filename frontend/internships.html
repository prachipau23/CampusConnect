<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Internship Board – CampusConnect</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Main Navigation Header -->
  <div id="main-nav"></div>

  <!-- Main Content Container -->
  <main class="main-content">

    <div class="page-header">
      <div>
        <h1 class="page-title">Internship & Research Opportunities</h1>
        <p class="page-subtitle">Apply for campus research roles, industry tech internships, and part-time developer fellowships.</p>
      </div>
    </div>

    <!-- Filter Bar -->
    <div class="filter-bar">
      <div class="search-input-wrapper">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="intern-search" class="form-control" placeholder="Search by role title, company, or keywords..." oninput="filterInternships()">
      </div>

      <div style="min-width: 180px;">
        <select id="intern-mode-filter" class="form-select" onchange="filterInternships()">
          <option value="">All Work Modes</option>
          <option value="Remote">Remote</option>
          <option value="Hybrid">Hybrid</option>
          <option value="On-Site">On-Site / Campus Lab</option>
        </select>
      </div>
    </div>

    <!-- Internships Grid -->
    <div class="grid grid-cols-2" id="internships-grid">
      <div style="grid-column: span 2; text-align: center; padding: 3rem; color: var(--stone-brown);">
        Loading internship postings...
      </div>
    </div>

  </main>

  <!-- Footer -->
  <div id="main-footer"></div>

  <!-- JavaScript dependencies -->
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  <script>
    let internshipsList = [];

    document.addEventListener("DOMContentLoaded", () => {
      loadInternships();
    });

    async function loadInternships() {
      try {
        internshipsList = await apiGet("/api/internships");
        renderInternships(internshipsList);
      } catch (err) {
        document.getElementById("internships-grid").innerHTML = `
          <div class="card" style="grid-column: span 2; text-align: center; padding: 3rem;">
            <h3>Error loading internships</h3>
            <p style="color: var(--stone-brown);">${err.message}</p>
          </div>
        `;
      }
    }

    function renderInternships(list) {
      const grid = document.getElementById("internships-grid");
      if (!grid) return;

      if (!list || list.length === 0) {
        grid.innerHTML = `<div class="card" style="grid-column: span 2; text-align: center; padding: 3rem;">
          <h3>No internships found</h3>
          <p style="color: var(--stone-brown);">Check back soon for new openings.</p>
        </div>`;
        return;
      }

      grid.innerHTML = list.map(i => {
        const stipendFormatted = i.stipend ? `₹${Number(i.stipend).toLocaleString('en-IN')}/mo` : 'Competitive';

        return `
          <div class="card card-interactive" data-internship-id="${i.id}" style="display: flex; flex-direction: column;">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.75rem;">
              <span class="badge badge-bordeaux">${i.mode || 'Remote'}</span>
              <span style="font-weight: 700; color: var(--night-bordeaux); font-size: 1.05rem;">${stipendFormatted}</span>
            </div>

            <h3 style="font-size: 1.25rem; margin-bottom: 0.25rem; color: var(--black);">${i.title}</h3>
            <div style="font-size: 0.9rem; font-weight: 600; color: var(--stone-brown); margin-bottom: 0.75rem;">
              🏢 ${i.company} • 📍 ${i.location || 'Campus / Remote'}
            </div>

            <p style="color: var(--stone-brown); font-size: 0.9rem; margin-bottom: 1.25rem; line-height: 1.5;">
              ${i.description}
            </p>

            <div style="font-size: 0.8rem; color: var(--stone-brown); margin-bottom: 1.25rem;">
              ⏱️ Duration: <strong>${i.duration || '3-6 Months'}</strong> • 📅 Deadline: <strong>${i.deadline || 'Rolling'}</strong>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); padding-top: 0.85rem; margin-top: auto;">
              <span style="font-size: 0.825rem; color: var(--stone-brown);">Verified Partner</span>
              <a href="${i.applyUrl || '#'}" target="_blank" class="btn btn-sm btn-primary" onclick="handleApply('${i.title}')">
                Apply Now &rarr;
              </a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterInternships() {
      const search = document.getElementById("intern-search").value.toLowerCase();
      const mode = document.getElementById("intern-mode-filter").value;

      const filtered = internshipsList.filter(i => {
        const matchesSearch = (i.title && i.title.toLowerCase().includes(search)) ||
                              (i.company && i.company.toLowerCase().includes(search)) ||
                              (i.description && i.description.toLowerCase().includes(search));
        const matchesMode = !mode || (i.mode && i.mode.toLowerCase() === mode.toLowerCase());
        return matchesSearch && matchesMode;
      });

      renderInternships(filtered);
    }

    function handleApply(title) {
      showToast(`Redirecting to application for ${title}...`, "info");
    }
  </script>
</body>
</html>
