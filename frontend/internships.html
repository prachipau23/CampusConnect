<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Internship Board – CampusConnect</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Main Navigation Header -->
  <div id="main-nav"></div>

  <!-- Main Content Container -->
  <main class="main-content">

    <div class="page-header">
      <div>
        <h1 class="page-title">Campus & Partner Internships</h1>
        <p class="page-subtitle">Discover research assistantships, campus tech lab roles, and industry partner apprenticeships.</p>
      </div>
    </div>

    <!-- Filter Bar -->
    <div class="filter-bar">
      <div class="search-input-wrapper">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="int-search" class="form-control" placeholder="Search role title, company..." oninput="filterInternships()">
      </div>

      <div style="min-width: 180px;">
        <select id="int-type-filter" class="form-select" onchange="filterInternships()">
          <option value="">All Types</option>
          <option value="Research">Research & Development</option>
          <option value="Industry">Industry Partner</option>
          <option value="Academic">Academic Research</option>
        </select>
      </div>
    </div>

    <!-- Internship Cards Grid -->
    <div class="grid grid-cols-3" id="internships-grid">
      <!-- Populated via JS -->
    </div>

  </main>

  <!-- Apply Internship Modal -->
  <div class="modal-backdrop" id="apply-intern-modal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title">Apply for Opportunity</h3>
        <button class="modal-close" data-modal-close>&times;</button>
      </div>
      <form onsubmit="handleApplySubmit(event)">
        <div class="modal-body">
          <p style="margin-bottom: 1rem; color: var(--stone-brown); font-size: 0.9rem;">
            Applying for: <strong id="apply-int-title" style="color: var(--black);">Full-Stack Software Engineering Intern</strong>
          </p>

          <div class="form-group">
            <label class="form-label">Cover Note / Statement of Interest *</label>
            <textarea class="form-control" rows="3" placeholder="Briefly describe why you are interested in this position and your relevant coursework/projects..." required></textarea>
          </div>

          <div style="background-color: var(--white-smoke); padding: 0.85rem; border-radius: var(--radius-sm); font-size: 0.8rem; color: var(--stone-brown);">
            📄 Your current uploaded resume (<strong>Aarav_Sharma_Resume_2026.pdf</strong>) will be attached automatically.
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" data-modal-close>Cancel</button>
          <button type="submit" class="btn btn-primary">Submit Application</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <div id="main-footer"></div>

  <!-- JavaScript dependencies -->
  <script src="js/mock-data.js"></script>
  <script src="js/main.js"></script>
  <script>
    let internshipsList = MOCK_DATA.internships;

    document.addEventListener("DOMContentLoaded", () => {
      renderInternships(internshipsList);
    });

    function renderInternships(list) {
      const grid = document.getElementById("internships-grid");
      if (!grid) return;

      if (list.length === 0) {
        grid.innerHTML = `<div class="card" style="grid-column: span 3; text-align: center; padding: 3rem;">
          <h3>No internship listings found</h3>
          <p style="color: var(--stone-brown);">Try adjusting your search criteria.</p>
        </div>`;
        return;
      }

      grid.innerHTML = list.map(i => `
        <div class="card card-interactive" data-internship-id="${i.id}" style="display: flex; flex-direction: column;">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.75rem;">
            <span class="badge badge-bordeaux">${i.type}</span>
            <span class="badge badge-taupe">${i.location}</span>
          </div>

          <h3 style="font-size: 1.15rem; margin-bottom: 0.25rem;">${i.title}</h3>
          <div style="font-size: 0.875rem; color: var(--night-bordeaux); font-weight: 700; margin-bottom: 1rem;">
            🏢 ${i.company}
          </div>

          <div style="background-color: var(--white-smoke); border: 1px solid var(--border-color); padding: 0.75rem; border-radius: var(--radius-md); margin-bottom: 1.25rem; font-size: 0.825rem; display: flex; flex-direction: column; gap: 0.4rem;">
            <div><strong>💰 Stipend:</strong> ${i.stipend}</div>
            <div><strong>⏱️ Duration:</strong> ${i.duration}</div>
            <div><strong>🎓 Eligibility:</strong> ${i.departmentReq}</div>
            <div><strong>📅 Deadline:</strong> ${i.deadline}</div>
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); padding-top: 0.85rem; margin-top: auto;">
            <span style="font-size: 0.775rem; color: var(--stone-brown);">Verified Listing</span>
            <button class="btn btn-sm btn-primary" onclick="openApplyModal('${i.title}')">
              Apply Now &rarr;
            </button>
          </div>
        </div>
      `).join('');
    }

    function filterInternships() {
      const search = document.getElementById("int-search").value.toLowerCase();
      const type = document.getElementById("int-type-filter").value.toLowerCase();

      const filtered = internshipsList.filter(i => {
        const matchesSearch = i.title.toLowerCase().includes(search) || i.company.toLowerCase().includes(search);
        const matchesType = !type || i.type.toLowerCase().includes(type);
        return matchesSearch && matchesType;
      });

      renderInternships(filtered);
    }

    function openApplyModal(title) {
      document.getElementById("apply-int-title").innerText = title;
      document.getElementById("apply-intern-modal").classList.add("show");
    }

    function handleApplySubmit(e) {
      e.preventDefault();
      document.getElementById("apply-intern-modal").classList.remove("show");
      showToast("Application submitted successfully!", "success");
    }
  </script>
</body>
</html>
