<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Teams – CampusConnect</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Main Navigation Header -->
  <div id="main-nav"></div>

  <!-- Main Content Container -->
  <main class="main-content">

    <div class="page-header">
      <div>
        <h1 class="page-title">Project Collaboration Teams</h1>
        <p class="page-subtitle">Form cross-disciplinary teams, recruit developers & designers, and collaborate in team workspaces.</p>
      </div>
      <button class="btn btn-primary" onclick="openCreateTeamModal()">
        ➕ Create New Team
      </button>
    </div>

    <!-- Teams Grid -->
    <div class="grid grid-cols-2" id="teams-grid">
      <div style="grid-column: span 2; text-align: center; padding: 3rem; color: var(--stone-brown);">
        Loading teams...
      </div>
    </div>

  </main>

  <!-- Create Team Modal -->
  <div class="modal-backdrop" id="create-team-modal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title">Create Collaboration Team</h3>
        <button class="modal-close" data-modal-close>&times;</button>
      </div>
      <form onsubmit="handleCreateTeam(event)">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="team-name">Team Name *</label>
            <input type="text" id="team-name" class="form-control" placeholder="e.g. AI Core Engineering Squad" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="team-desc">Team Goal / Description *</label>
            <textarea id="team-desc" class="form-control" rows="3" placeholder="What is your team building and what skills are needed?" required></textarea>
          </div>

          <div class="form-group">
            <label class="form-label" for="team-max-size">Max Team Size</label>
            <input type="number" id="team-max-size" class="form-control" value="5" min="2" max="10">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" data-modal-close>Cancel</button>
          <button type="submit" id="team-submit-btn" class="btn btn-primary">Create Team</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <div id="main-footer"></div>

  <!-- JavaScript dependencies -->
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  <script>
    let teamsList = [];

    document.addEventListener("DOMContentLoaded", () => {
      loadTeams();
    });

    async function loadTeams() {
      try {
        teamsList = await apiGet("/api/teams");
        renderTeams(teamsList);
      } catch (err) {
        document.getElementById("teams-grid").innerHTML = `
          <div class="card" style="grid-column: span 2; text-align: center; padding: 3rem;">
            <h3>Error loading teams</h3>
            <p style="color: var(--stone-brown);">${err.message}</p>
          </div>
        `;
      }
    }

    function renderTeams(list) {
      const grid = document.getElementById("teams-grid");
      if (!grid) return;

      if (!list || list.length === 0) {
        grid.innerHTML = `<div class="card" style="grid-column: span 2; text-align: center; padding: 3rem;">
          <h3>No teams found</h3>
          <p style="color: var(--stone-brown);">Create the first team to begin collaborating!</p>
        </div>`;
        return;
      }

      grid.innerHTML = list.map(t => {
        const isOpen = t.status === 'OPEN';
        const projectTitle = t.linkedProject ? t.linkedProject.title : 'Independent Initiative';

        return `
          <div class="card card-interactive" data-team-id="${t.id}" style="display: flex; flex-direction: column;">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.75rem;">
              <span class="badge ${isOpen ? 'badge-bordeaux' : 'badge-dark'}">${t.status || 'OPEN'}</span>
              <span style="font-size: 0.85rem; font-weight: 600; color: var(--stone-brown);">Max Size: ${t.maxSize || 5}</span>
            </div>

            <h3 style="font-size: 1.25rem; color: var(--night-bordeaux); margin-bottom: 0.5rem;">
              <a href="team-workspace.html?teamId=${t.id}" style="color: inherit;">${t.name}</a>
            </h3>

            <div style="font-size: 0.825rem; color: var(--stone-brown); margin-bottom: 0.75rem;">
              Linked Project: <strong>${projectTitle}</strong>
            </div>

            <p style="color: var(--stone-brown); font-size: 0.9rem; margin-bottom: 1.25rem; line-height: 1.5;">
              ${t.description}
            </p>

            <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); padding-top: 0.85rem; margin-top: auto;">
              <button class="btn btn-sm btn-ghost" onclick="joinTeam('${t.id}', '${t.name}')">
                🤝 Request to Join
              </button>
              <a href="team-workspace.html?teamId=${t.id}" class="btn btn-sm btn-primary">
                Open Workspace &rarr;
              </a>
            </div>
          </div>
        `;
      }).join('');
    }

    function openCreateTeamModal() {
      if (!getAuthToken()) {
        showToast("Please sign in to create a team.", "info");
        setTimeout(() => { window.location.href = "login.html"; }, 800);
        return;
      }
      document.getElementById("create-team-modal").classList.add("show");
    }

    async function handleCreateTeam(e) {
      e.preventDefault();
      const name = document.getElementById("team-name").value.trim();
      const description = document.getElementById("team-desc").value.trim();
      const maxSize = parseInt(document.getElementById("team-max-size").value) || 5;
      const submitBtn = document.getElementById("team-submit-btn");

      submitBtn.disabled = true;
      submitBtn.innerText = "Creating...";

      try {
        await apiPost("/api/teams", { name, description, maxSize });
        document.getElementById("create-team-modal").classList.remove("show");
        showToast(`Team '${name}' created successfully!`, "success");
        loadTeams();
      } catch (err) {
        showToast(err.message || "Failed to create team", "error");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Create Team";
      }
    }

    async function joinTeam(id, name) {
      if (!getAuthToken()) {
        showToast("Please sign in to join teams.", "info");
        setTimeout(() => { window.location.href = "login.html"; }, 800);
        return;
      }

      try {
        await apiPost(`/api/teams/${id}/join`, {});
        showToast(`Joined team '${name}'!`, "success");
      } catch (err) {
        showToast(err.message || "Could not join team", "info");
      }
    }
  </script>
</body>
</html>
