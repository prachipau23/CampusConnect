<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Workspace – CampusConnect</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Main Navigation Header -->
  <div id="main-nav"></div>

  <!-- Main Content Container -->
  <main class="main-content">

    <div class="page-header">
      <div>
        <a href="teams.html" style="font-weight: 600; font-size: 0.875rem; color: var(--night-bordeaux); display: inline-block; margin-bottom: 0.5rem;">&larr; Back to Teams</a>
        <h1 class="page-title" id="workspace-team-title">Team Workspace</h1>
        <p class="page-subtitle" id="workspace-team-desc">Real-time team discussion board and progress updates.</p>
      </div>
    </div>

    <div class="grid grid-cols-3" style="align-items: start;">

      <!-- Left 2 Cols: Workspace Posts Stream -->
      <div class="card" style="grid-column: span 2;">
        <h3 style="font-size: 1.2rem; color: var(--black); margin-bottom: 1.25rem;">Discussion & Activity Stream</h3>

        <!-- Post Input Box -->
        <form onsubmit="handlePostMessage(event)" style="margin-bottom: 2rem;">
          <div class="form-group">
            <textarea id="workspace-post-input" class="form-control" rows="3" placeholder="Share a progress update, code link, or question with the team..." required></textarea>
          </div>
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <select id="workspace-post-type" class="form-select" style="max-width: 160px; font-size: 0.85rem;">
              <option value="UPDATE">General Update</option>
              <option value="TASK">Task Completed</option>
              <option value="RESOURCE">Resource Shared</option>
            </select>
            <button type="submit" id="post-submit-btn" class="btn btn-sm btn-primary">Post to Workspace</button>
          </div>
        </form>

        <div id="workspace-posts-list" style="display: flex; flex-direction: column; gap: 1rem;">
          <div style="text-align: center; padding: 2rem; color: var(--stone-brown);">Loading team posts...</div>
        </div>
      </div>

      <!-- Right Col: Team Info -->
      <div class="card" style="grid-column: span 1;">
        <h3 style="font-size: 1.15rem; color: var(--black); margin-bottom: 1rem;">Team Overview</h3>
        <div style="font-size: 0.9rem; color: var(--stone-brown); margin-bottom: 1.5rem;" id="workspace-overview-box">
          Loading details...
        </div>

        <div style="border-top: 1px solid var(--border-color); padding-top: 1rem;">
          <h4 style="font-size: 0.85rem; text-transform: uppercase; color: var(--stone-brown); margin-bottom: 0.5rem; letter-spacing: 0.05em;">Workspace Tools</h4>
          <p style="font-size: 0.825rem; color: var(--stone-brown); margin-bottom: 1rem;">
            Use this workspace to coordinate sprints and submit hackathon entries.
          </p>
          <a href="hackathons.html" class="btn btn-sm btn-outline" style="width: 100%; text-align: center;">
            🏆 Browse Hackathons
          </a>
        </div>
      </div>

    </div>

  </main>

  <!-- Footer -->
  <div id="main-footer"></div>

  <!-- JavaScript dependencies -->
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  <script>
    let currentTeamId = null;

    document.addEventListener("DOMContentLoaded", () => {
      loadWorkspace();
    });

    async function loadWorkspace() {
      const params = new URLSearchParams(window.location.search);
      currentTeamId = params.get("teamId");

      if (!currentTeamId) {
        // Fallback: try loading first team from /api/teams
        try {
          const teams = await apiGet("/api/teams");
          if (teams.length > 0) {
            currentTeamId = teams[0].id;
          }
        } catch (e) {}
      }

      if (!currentTeamId) {
        document.getElementById("workspace-team-title").innerText = "Team not found";
        return;
      }

      try {
        const team = await apiGet(`/api/teams/${currentTeamId}`);
        document.getElementById("workspace-team-title").innerText = `${team.name} Workspace`;
        document.getElementById("workspace-team-desc").innerText = team.description;

        document.getElementById("workspace-overview-box").innerHTML = `
          <div style="margin-bottom: 0.5rem;"><strong>Status:</strong> <span class="badge badge-bordeaux">${team.status}</span></div>
          <div style="margin-bottom: 0.5rem;"><strong>Max Members:</strong> ${team.maxSize}</div>
          <div><strong>Created:</strong> ${formatTimeAgo(team.createdAt)}</div>
        `;

        loadPosts();
      } catch (err) {
        document.getElementById("workspace-team-title").innerText = "Error loading team";
      }
    }

    async function loadPosts() {
      const listContainer = document.getElementById("workspace-posts-list");
      try {
        const posts = await apiGet(`/api/teams/${currentTeamId}/workspace`);
        if (!posts || posts.length === 0) {
          listContainer.innerHTML = `<div style="text-align: center; padding: 2rem; color: var(--stone-brown);">No updates yet. Write the first post above!</div>`;
          return;
        }

        listContainer.innerHTML = posts.map(p => {
          const author = p.author ? (p.author.username || 'Member') : 'Team Member';
          return `
            <div style="background-color: var(--white-smoke); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 1rem;">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                  <span style="font-weight: 700; color: var(--night-bordeaux); font-size: 0.9rem;">@${author}</span>
                  <span class="badge badge-taupe" style="font-size: 0.7rem;">${p.postType || 'UPDATE'}</span>
                </div>
                <span style="font-size: 0.8rem; color: var(--stone-brown);">${formatTimeAgo(p.createdAt)}</span>
              </div>
              <div style="color: var(--black); font-size: 0.925rem; line-height: 1.5;">${p.content}</div>
            </div>
          `;
        }).join('');
      } catch (err) {
        listContainer.innerHTML = `<div style="color: #dc2626; padding: 1rem;">Could not load workspace posts: ${err.message}</div>`;
      }
    }

    async function handlePostMessage(e) {
      e.preventDefault();
      if (!getAuthToken()) {
        showToast("Please sign in to post updates.", "info");
        setTimeout(() => { window.location.href = "login.html"; }, 800);
        return;
      }

      const input = document.getElementById("workspace-post-input");
      const postType = document.getElementById("workspace-post-type").value;
      const content = input.value.trim();
      const submitBtn = document.getElementById("post-submit-btn");

      submitBtn.disabled = true;
      submitBtn.innerText = "Posting...";

      try {
        await apiPost(`/api/teams/${currentTeamId}/workspace`, { content, postType });
        input.value = "";
        showToast("Update posted to workspace!", "success");
        loadPosts();
      } catch (err) {
        showToast(err.message || "Failed to post update", "error");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Post to Workspace";
      }
    }
  </script>
</body>
</html>
