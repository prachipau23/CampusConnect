<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Showcase – CampusConnect</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Main Navigation Header -->
  <div id="main-nav"></div>

  <!-- Main Content Container -->
  <main class="main-content">

    <div class="page-header">
      <div>
        <h1 class="page-title">Student Project Showcase</h1>
        <p class="page-subtitle">Discover innovation projects created by campus students or showcase your own work.</p>
      </div>
      <button class="btn btn-primary" onclick="openAddProjectModal()">
        ➕ Publish New Project
      </button>
    </div>

    <!-- Search & Filter Bar -->
    <div class="filter-bar">
      <div class="search-input-wrapper">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="project-search" class="form-control" placeholder="Search by project name, tech stack, or author..." oninput="filterProjects()">
      </div>

      <div style="min-width: 180px;">
        <select id="status-filter" class="form-select" onchange="filterProjects()">
          <option value="">All Statuses</option>
          <option value="ACTIVE">Active / In Development</option>
          <option value="COMPLETED">Completed</option>
          <option value="ARCHIVED">Archived</option>
        </select>
      </div>
    </div>

    <!-- Projects Showcase Grid -->
    <div class="grid grid-cols-2" id="projects-grid">
      <div style="grid-column: span 2; text-align: center; padding: 3rem; color: var(--stone-brown);">
        Loading live projects...
      </div>
    </div>

  </main>

  <!-- Add Project Modal -->
  <div class="modal-backdrop" id="add-project-modal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title">Publish New Student Project</h3>
        <button class="modal-close" data-modal-close>&times;</button>
      </div>
      <form id="add-project-form" onsubmit="handleAddProject(event)">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="prj-title">Project Title *</label>
            <input type="text" id="prj-title" class="form-control" placeholder="e.g. CampusConnect Platform" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="prj-status">Project Status</label>
            <select id="prj-status" class="form-select">
              <option value="ACTIVE">Active / In Development</option>
              <option value="COMPLETED">Completed</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="prj-desc">Project Description *</label>
            <textarea id="prj-desc" class="form-control" rows="3" placeholder="Explain the problem solved and core features..." required></textarea>
          </div>

          <div class="form-group">
            <label class="form-label" for="prj-stack">Technologies Used (comma separated) *</label>
            <input type="text" id="prj-stack" class="form-control" placeholder="e.g. Java, Spring Boot, React, PostgreSQL, Docker" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="prj-repo">GitHub Repository URL</label>
            <input type="url" id="prj-repo" class="form-control" placeholder="https://github.com/username/project">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" data-modal-close>Cancel</button>
          <button type="submit" id="prj-submit-btn" class="btn btn-primary">Publish Project</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <div id="main-footer"></div>

  <!-- JavaScript dependencies -->
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  <script>
    let projectsList = [];

    document.addEventListener("DOMContentLoaded", () => {
      loadProjects();
    });

    async function loadProjects() {
      try {
        projectsList = await apiGet("/api/projects");
        renderProjects(projectsList);
      } catch (err) {
        document.getElementById("projects-grid").innerHTML = `
          <div class="card" style="grid-column: span 2; text-align: center; padding: 3rem;">
            <h3>Error loading projects</h3>
            <p style="color: var(--stone-brown);">${err.message}</p>
          </div>
        `;
      }
    }

    function renderProjects(list) {
      const grid = document.getElementById("projects-grid");
      if (!grid) return;

      if (!list || list.length === 0) {
        grid.innerHTML = `<div class="card" style="grid-column: span 2; text-align: center; padding: 3rem;">
          <h3>No projects found</h3>
          <p style="color: var(--stone-brown);">Be the first student to publish a project!</p>
        </div>`;
        return;
      }

      grid.innerHTML = list.map(p => {
        const stackArr = p.techStack ? p.techStack.split(',').map(s => s.trim()).filter(Boolean) : [];
        const author = p.owner ? (p.owner.username || 'Student') : 'Campus Engineer';

        return `
          <div class="card card-interactive" data-project-id="${p.id}" style="display: flex; flex-direction: column;">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.75rem;">
              <span class="badge ${p.status === 'COMPLETED' ? 'badge-dark' : 'badge-bordeaux'}">${p.status || 'ACTIVE'}</span>
              <span style="font-size: 0.85rem; font-weight: 600; color: var(--stone-brown);">${formatTimeAgo(p.createdAt)}</span>
            </div>

            <h3 style="margin-bottom: 0.5rem; font-size: 1.25rem;">
              <a href="project-detail.html?id=${p.id}" style="color: var(--night-bordeaux);">${p.title}</a>
            </h3>

            <p style="color: var(--stone-brown); font-size: 0.9rem; margin-bottom: 1.25rem; line-height: 1.5;">
              ${p.description}
            </p>

            <div style="display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 1.25rem;">
              ${stackArr.map(t => `<span class="badge badge-taupe">${t}</span>`).join('')}
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); padding-top: 0.85rem; margin-top: auto;">
              <span style="font-size: 0.825rem; color: var(--stone-brown);">Lead: <strong>${author}</strong></span>
              <a href="project-detail.html?id=${p.id}" class="btn btn-sm btn-outline">View Details &rarr;</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterProjects() {
      const search = document.getElementById("project-search").value.toLowerCase();
      const status = document.getElementById("status-filter").value;

      const filtered = projectsList.filter(p => {
        const matchesSearch = (p.title && p.title.toLowerCase().includes(search)) ||
                              (p.description && p.description.toLowerCase().includes(search)) ||
                              (p.techStack && p.techStack.toLowerCase().includes(search)) ||
                              (p.owner && p.owner.username.toLowerCase().includes(search));
        const matchesStatus = !status || (p.status && p.status.toUpperCase() === status.toUpperCase());
        return matchesSearch && matchesStatus;
      });

      renderProjects(filtered);
    }

    function openAddProjectModal() {
      if (!getAuthToken()) {
        showToast("Please sign in to publish a project.", "info");
        setTimeout(() => { window.location.href = "login.html"; }, 800);
        return;
      }
      document.getElementById("add-project-modal").classList.add("show");
    }

    async function handleAddProject(e) {
      e.preventDefault();
      const title = document.getElementById("prj-title").value.trim();
      const status = document.getElementById("prj-status").value;
      const description = document.getElementById("prj-desc").value.trim();
      const techStack = document.getElementById("prj-stack").value.trim();
      const githubUrl = document.getElementById("prj-repo").value.trim();
      const submitBtn = document.getElementById("prj-submit-btn");

      submitBtn.disabled = true;
      submitBtn.innerText = "Publishing...";

      try {
        await apiPost("/api/projects", {
          title,
          status,
          description,
          techStack,
          githubUrl
        });

        document.getElementById("add-project-modal").classList.remove("show");
        showToast("Project published successfully!", "success");
        loadProjects();
      } catch (err) {
        showToast(err.message || "Failed to publish project", "error");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Publish Project";
      }
    }
  </script>
</body>
</html>
