<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Showcase – CampusConnect</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Main Navigation Header -->
  <div id="main-nav"></div>

  <!-- Main Content Container -->
  <main class="main-content">

    <div class="page-header">
      <div>
        <h1 class="page-title">Student Project Showcase</h1>
        <p class="page-subtitle">Discover innovation projects created by students or showcase your own work.</p>
      </div>
      <button class="btn btn-primary" data-modal-target="add-project-modal">
        ➕ Publish New Project
      </button>
    </div>

    <!-- Search & Filter Bar -->
    <div class="filter-bar">
      <div class="search-input-wrapper">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="project-search" class="form-control" placeholder="Search by project name or keyword..." oninput="filterProjects()">
      </div>

      <div style="min-width: 180px;">
        <select id="domain-filter" class="form-select" onchange="filterProjects()">
          <option value="">All Domains</option>
          <option value="Web & Mobile">Web & Mobile</option>
          <option value="IoT & Hardware">IoT & Hardware</option>
          <option value="Artificial Intelligence">Artificial Intelligence</option>
          <option value="Developer Tools">Developer Tools</option>
        </select>
      </div>

      <div style="min-width: 160px;">
        <select id="status-filter" class="form-select" onchange="filterProjects()">
          <option value="">All Statuses</option>
          <option value="In Development">In Development</option>
          <option value="Beta Testing">Beta Testing</option>
          <option value="Active">Active</option>
          <option value="Concept">Concept</option>
        </select>
      </div>
    </div>

    <!-- Projects Showcase Grid -->
    <div class="grid grid-cols-2" id="projects-grid">
      <!-- Dynamically populated via JS -->
    </div>

  </main>

  <!-- Add Project Modal -->
  <div class="modal-backdrop" id="add-project-modal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title">Publish New Student Project</h3>
        <button class="modal-close" data-modal-close>&times;</button>
      </div>
      <form id="add-project-form" onsubmit="handleAddProject(event)">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="prj-title">Project Title *</label>
            <input type="text" id="prj-title" class="form-control" placeholder="e.g. CampusConnect Platform" required>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
              <label class="form-label" for="prj-category">Category / Domain *</label>
              <select id="prj-category" class="form-select" required>
                <option value="Web & Mobile">Web & Mobile</option>
                <option value="IoT & Hardware">IoT & Hardware</option>
                <option value="Artificial Intelligence">Artificial Intelligence</option>
                <option value="Developer Tools">Developer Tools</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="prj-status">Current Status</label>
              <select id="prj-status" class="form-select">
                <option value="In Development">In Development</option>
                <option value="Concept">Concept</option>
                <option value="Beta Testing">Beta Testing</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="prj-desc">Short Summary *</label>
            <input type="text" id="prj-desc" class="form-control" placeholder="Brief 1-2 sentence overview" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="prj-detail-desc">Detailed Problem Statement & Solution</label>
            <textarea id="prj-detail-desc" class="form-control" placeholder="Describe the problem, target users, and architectural design..."></textarea>
          </div>

          <div class="form-group">
            <label class="form-label" for="prj-stack">Tech Stack (comma separated)</label>
            <input type="text" id="prj-stack" class="form-control" placeholder="e.g. Java, Spring Boot, React, PostgreSQL">
          </div>

          <div class="form-group">
            <label class="form-label" for="prj-repo">GitHub Repository URL</label>
            <input type="url" id="prj-repo" class="form-control" placeholder="https://github.com/org/repo">
          </div>

          <div class="form-group">
            <label class="form-label" for="prj-roles">Open Roles Needed (comma separated)</label>
            <input type="text" id="prj-roles" class="form-control" placeholder="e.g. Mobile App Dev, UI/UX Designer">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" data-modal-close>Cancel</button>
          <button type="submit" class="btn btn-primary">Publish Project</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <div id="main-footer"></div>

  <!-- JavaScript dependencies -->
  <script src="js/mock-data.js"></script>
  <script src="js/main.js"></script>
  <script>
    let currentProjects = getStoredData("projects", MOCK_DATA.projects);

    document.addEventListener("DOMContentLoaded", () => {
      renderProjects(currentProjects);
    });

    function renderProjects(projects) {
      const grid = document.getElementById("projects-grid");
      if (!grid) return;

      if (projects.length === 0) {
        grid.innerHTML = `<div class="card" style="grid-column: span 2; text-align: center; padding: 3rem;">
          <h3>No projects matched your criteria</h3>
          <p style="color: var(--stone-brown);">Try adjusting your search terms or domain filter.</p>
        </div>`;
        return;
      }

      grid.innerHTML = projects.map(p => `
        <div class="card card-interactive" data-project-id="${p.id}">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.75rem;">
            <span class="badge badge-bordeaux">${p.category}</span>
            <div style="display: flex; gap: 0.75rem; font-size: 0.825rem; font-weight: 600; color: var(--stone-brown);">
              <span>★ ${p.stars}</span>
              <span>👁️ ${p.views}</span>
            </div>
          </div>

          <h3 style="margin-bottom: 0.5rem; font-size: 1.25rem;">
            <a href="project-detail.html?id=${p.id}">${p.title}</a>
          </h3>

          <p style="color: var(--stone-brown); font-size: 0.9rem; margin-bottom: 1rem; line-height: 1.5;">
            ${p.description}
          </p>

          <div style="display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 1.25rem;">
            ${p.techStack.map(t => `<span class="badge badge-taupe">${t}</span>`).join('')}
          </div>

          ${p.openRolesNeeded && p.openRolesNeeded.length > 0 ? `
            <div style="background-color: var(--night-bordeaux-light); padding: 0.5rem 0.75rem; border-radius: var(--radius-sm); font-size: 0.8rem; margin-bottom: 1rem; color: var(--night-bordeaux); font-weight: 600;">
              🔍 Recruitment: ${p.openRolesNeeded.join(', ')}
            </div>
          ` : ''}

          <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); padding-top: 0.85rem; margin-top: auto;">
            <div style="display: flex; align-items: center; gap: 0.5rem;">
              <div class="user-avatar" style="width: 26px; height: 26px; font-size: 0.7rem;">${p.author ? p.author.split(' ').map(n=>n[0]).join('') : 'ST'}</div>
              <span style="font-size: 0.825rem; color: var(--stone-brown);">${p.author}</span>
            </div>
            <a href="project-detail.html?id=${p.id}" class="btn btn-sm btn-primary">View Details &rarr;</a>
          </div>
        </div>
      `).join('');
    }

    function filterProjects() {
      const search = document.getElementById("project-search").value.toLowerCase();
      const domain = document.getElementById("domain-filter").value;
      const status = document.getElementById("status-filter").value;

      const filtered = currentProjects.filter(p => {
        const matchesSearch = p.title.toLowerCase().includes(search) || p.description.toLowerCase().includes(search) || p.techStack.some(t => t.toLowerCase().includes(search));
        const matchesDomain = !domain || p.category === domain;
        const matchesStatus = !status || p.status === status;
        return matchesSearch && matchesDomain && matchesStatus;
      });

      renderProjects(filtered);
    }

    function handleAddProject(e) {
      e.preventDefault();
      const newPrj = {
        id: "prj-" + Date.now(),
        title: document.getElementById("prj-title").value,
        category: document.getElementById("prj-category").value,
        status: document.getElementById("prj-status").value,
        description: document.getElementById("prj-desc").value,
        detailedDescription: document.getElementById("prj-detail-desc").value || document.getElementById("prj-desc").value,
        stars: 1,
        views: 12,
        techStack: document.getElementById("prj-stack").value.split(',').map(s=>s.trim()).filter(Boolean),
        author: MOCK_DATA.currentUser.name,
        authorDept: MOCK_DATA.currentUser.department,
        teamMembers: [{ name: MOCK_DATA.currentUser.name, role: "Project Owner", avatar: MOCK_DATA.currentUser.avatar }],
        openRolesNeeded: document.getElementById("prj-roles").value.split(',').map(s=>s.trim()).filter(Boolean),
        repoUrl: document.getElementById("prj-repo").value || "#",
        createdDate: new Date().toISOString().split('T')[0]
      };

      currentProjects.unshift(newPrj);
      setStoredData("projects", currentProjects);

      renderProjects(currentProjects);
      document.getElementById("add-project-modal").classList.remove("show");
      document.getElementById("add-project-form").reset();
      showToast("Project published successfully to showcase!", "success");
    }
  </script>
</body>
</html>
