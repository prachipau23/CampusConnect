<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Directory – CampusConnect</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Main Navigation Header -->
  <div id="main-nav"></div>

  <!-- Main Content Container -->
  <main class="main-content">

    <div class="page-header">
      <div>
        <h1 class="page-title">Campus Directory</h1>
        <p class="page-subtitle">Connect with student developers, peer researchers, and faculty mentors.</p>
      </div>
    </div>

    <!-- Teacher / Admin CGPA Filter Bar -->
    <div id="teacher-gpa-filter-bar" style="display: none; background: var(--white-smoke); border: 1px solid var(--dusty-taupe); border-radius: var(--radius-md); padding: 1rem 1.25rem; margin-bottom: 1.5rem; display: flex; gap: 1.25rem; align-items: center; flex-wrap: wrap;">
      <div style="font-weight: 700; font-size: 0.95rem; color: var(--night-bordeaux); display: flex; align-items: center; gap: 0.4rem;">
        <span>🎓</span>
        <span>Student GPA Filter:</span>
      </div>
      <div style="display: flex; align-items: center; gap: 0.5rem;">
        <label for="min-gpa" style="font-size: 0.85rem; font-weight: 600; color: var(--stone-brown);">Min GPA:</label>
        <input type="number" id="min-gpa" class="form-control" style="width: 100px; padding: 0.4rem 0.6rem;" min="0" max="10" step="0.1" placeholder="e.g. 7.5">
      </div>
      <div style="display: flex; align-items: center; gap: 0.5rem;">
        <label for="max-gpa" style="font-size: 0.85rem; font-weight: 600; color: var(--stone-brown);">Max GPA:</label>
        <input type="number" id="max-gpa" class="form-control" style="width: 100px; padding: 0.4rem 0.6rem;" min="0" max="10" step="0.1" placeholder="e.g. 10.0">
      </div>
      <div style="display: flex; gap: 0.5rem;">
        <button class="btn btn-sm btn-primary" onclick="applyGpaFilter()">Apply Filter</button>
        <button class="btn btn-sm btn-outline" onclick="clearGpaFilter()">Clear Filter</button>
      </div>
    </div>

    <!-- Search & Filters -->
    <div class="filter-bar">
      <div class="search-input-wrapper">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="dir-search" class="form-control" placeholder="Search by name, department, or technical skill..." oninput="filterDirectory()">
      </div>

      <div style="min-width: 200px;">
        <select id="dir-dept-filter" class="form-select" onchange="filterDirectory()">
          <option value="">All Departments</option>
          <option value="Computer Science">Computer Science</option>
          <option value="Information Technology">Information Technology</option>
          <option value="Data Science">Data Science</option>
          <option value="Electronics">Electronics</option>
          <option value="Administration">Faculty / Admin</option>
        </select>
      </div>
    </div>

    <!-- Directory Grid -->
    <div class="grid grid-cols-3" id="directory-grid">
      <div style="grid-column: span 3; text-align: center; padding: 3rem; color: var(--stone-brown);">
        Loading campus directory...
      </div>
    </div>

  </main>

  <!-- Footer -->
  <div id="main-footer"></div>

  <!-- JavaScript dependencies -->
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  <script>
    let directoryList = [];
    let isPrivilegedUser = false;

    document.addEventListener("DOMContentLoaded", () => {
      const storedUser = getStoredUser();
      isPrivilegedUser = storedUser && (storedUser.role === 'TEACHER' || storedUser.role === 'ADMIN' || storedUser.role === 'MENTOR');

      const filterBar = document.getElementById("teacher-gpa-filter-bar");
      if (filterBar) {
        filterBar.style.display = isPrivilegedUser ? "flex" : "none";
      }

      loadDirectory();
    });

    async function loadDirectory(params = "") {
      try {
        if (isPrivilegedUser) {
          directoryList = await apiGet(`/api/admin/students${params}`);
        } else {
          directoryList = await apiGet("/api/directory");
        }
        renderDirectory(directoryList);
      } catch (err) {
        // Fallback to public directory if admin route returns 403
        try {
          directoryList = await apiGet("/api/directory");
          renderDirectory(directoryList);
        } catch (innerErr) {
          document.getElementById("directory-grid").innerHTML = `
            <div class="card" style="grid-column: span 3; text-align: center; padding: 3rem;">
              <h3>Error loading directory</h3>
              <p style="color: var(--stone-brown);">${innerErr.message}</p>
            </div>
          `;
        }
      }
    }

    function applyGpaFilter() {
      const minVal = document.getElementById("min-gpa").value.trim();
      const maxVal = document.getElementById("max-gpa").value.trim();

      const queryParams = new URLSearchParams();
      if (minVal) queryParams.append("minGpa", minVal);
      if (maxVal) queryParams.append("maxGpa", maxVal);

      const queryString = queryParams.toString() ? `?${queryParams.toString()}` : "";
      showToast("Applying GPA filter...", "info");
      loadDirectory(queryString);
    }

    function clearGpaFilter() {
      document.getElementById("min-gpa").value = "";
      document.getElementById("max-gpa").value = "";
      showToast("Cleared GPA filter", "info");
      loadDirectory();
    }

    function renderDirectory(list) {
      const grid = document.getElementById("directory-grid");
      if (!grid) return;

      if (!list || list.length === 0) {
        grid.innerHTML = `<div class="card" style="grid-column: span 3; text-align: center; padding: 3rem;">
          <h3>No profiles found</h3>
          <p style="color: var(--stone-brown);">Try a different search query or GPA range.</p>
        </div>`;
        return;
      }

      grid.innerHTML = list.map(p => {
        const initials = p.avatarInitials || (p.fullName ? p.fullName.substring(0, 2).toUpperCase() : "CC");
        const skillsArr = p.skills ? p.skills.split(',').map(s => s.trim()).filter(Boolean).slice(0, 3) : [];
        const isFaculty = p.user && (p.user.role === 'TEACHER' || p.user.role === 'ADMIN' || p.user.role === 'MENTOR');
        const hasResume = p.resumeFileName && p.resumeFileName.trim().length > 0;

        return `
          <div class="card card-interactive" style="text-align: center; display: flex; flex-direction: column; align-items: center;">
            <div style="width: 64px; height: 64px; border-radius: 50%; background-color: var(--night-bordeaux); color: var(--white); font-weight: 800; font-size: 1.4rem; display: flex; align-items: center; justify-content: center; margin-bottom: 1rem; border: 2px solid var(--white-smoke);">
              ${initials}
            </div>

            <h3 style="font-size: 1.15rem; margin-bottom: 0.25rem; color: var(--black);">
              <a href="profile.html?userId=${p.user ? p.user.id : ''}" style="color: inherit;">${p.fullName}</a>
            </h3>

            <p style="color: var(--stone-brown); font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem;">
              ${p.department || 'General Department'}
            </p>

            <div style="display: flex; gap: 0.4rem; justify-content: center; align-items: center; margin-bottom: 0.75rem; flex-wrap: wrap;">
              <span class="badge ${isFaculty ? 'badge-dark' : 'badge-bordeaux'}">
                ${isFaculty ? (p.user.role === 'ADMIN' ? 'Administrator' : 'Faculty / Mentor') : (p.yearOfStudy || 'Student')}
              </span>
              ${p.gpa != null ? `<span class="badge badge-taupe" style="font-weight: 700;">GPA: ${p.gpa}</span>` : ''}
            </div>

            <p style="color: var(--stone-brown); font-size: 0.825rem; line-height: 1.4; margin-bottom: 1rem; max-height: 42px; overflow: hidden; text-overflow: ellipsis;">
              ${p.bio || 'Campus community member.'}
            </p>

            <div style="display: flex; gap: 0.35rem; flex-wrap: wrap; justify-content: center; margin-bottom: 1.25rem;">
              ${skillsArr.map(s => `<span class="badge badge-taupe" style="font-size: 0.75rem;">${s}</span>`).join('')}
            </div>

            <div style="margin-top: auto; width: 100%; border-top: 1px solid var(--border-color); padding-top: 0.75rem; display: flex; flex-direction: column; gap: 0.4rem;">
              <a href="profile.html?userId=${p.user ? p.user.id : ''}" class="btn btn-sm btn-outline" style="width: 100%;">
                View Profile &rarr;
              </a>
              ${(hasResume && isPrivilegedUser) ? `
                <button type="button" class="btn btn-sm btn-primary" style="width: 100%; font-size: 0.78rem; display: flex; align-items: center; justify-content: center; gap: 0.3rem;" onclick="downloadResumeDirect(${p.id}, '${p.resumeFileName}')">
                  📄 Download Resume
                </button>
              ` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    async function downloadResumeDirect(profileId, defaultFileName) {
      try {
        const response = await fetch(`${API_BASE_URL}/api/admin/students/${profileId}/resume/download`, {
          headers: authHeaders()
        });

        if (!response.ok) {
          throw new Error("Could not download student resume");
        }

        const blob = await response.blob();
        const filename = defaultFileName || "student_resume.pdf";

        const url = window.URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.style.display = "none";
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
        document.body.removeChild(a);
        showToast("Resume download started!", "success");
      } catch (err) {
        showToast(err.message || "Failed to download resume", "error");
      }
    }

    function filterDirectory() {
      const search = document.getElementById("dir-search").value.toLowerCase();
      const dept = document.getElementById("dir-dept-filter").value.toLowerCase();

      const filtered = directoryList.filter(p => {
        const matchesSearch = (p.fullName && p.fullName.toLowerCase().includes(search)) ||
                              (p.department && p.department.toLowerCase().includes(search)) ||
                              (p.skills && p.skills.toLowerCase().includes(search));
        const matchesDept = !dept || (p.department && p.department.toLowerCase().includes(dept));
        return matchesSearch && matchesDept;
      });

      renderDirectory(filtered);
    }
  </script>
</body>
</html>
