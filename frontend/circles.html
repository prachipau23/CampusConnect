<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collaboration Circles – CampusConnect</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Main Navigation Header -->
  <div id="main-nav"></div>

  <!-- Main Content Container -->
  <main class="main-content">

    <div class="page-header">
      <div>
        <h1 class="page-title">Collaboration Circles</h1>
        <p class="page-subtitle">Join domain interest groups, discuss ideas, share resources, and find teammates.</p>
      </div>
      <button class="btn btn-primary" onclick="openCreateCircleModal()">
        ➕ Create New Circle
      </button>
    </div>

    <!-- Circles Grid -->
    <div class="grid grid-cols-2" id="circles-grid">
      <div style="grid-column: span 2; text-align: center; padding: 3rem; color: var(--stone-brown);">
        Loading circles...
      </div>
    </div>

  </main>

  <!-- Create Circle Modal -->
  <div class="modal-backdrop" id="create-circle-modal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title">Create Domain Circle</h3>
        <button class="modal-close" data-modal-close>&times;</button>
      </div>
      <form onsubmit="handleCreateCircle(event)">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="circle-name">Circle Name *</label>
            <input type="text" id="circle-name" class="form-control" placeholder="e.g. Autonomous Robotics Guild" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="circle-cat">Category *</label>
            <select id="circle-cat" class="form-select" required>
              <option value="Technology">Technology & Engineering</option>
              <option value="AI & Data">AI & Data Science</option>
              <option value="Design">Creative & UI/UX Design</option>
              <option value="Entrepreneurship">Entrepreneurship & Startups</option>
              <option value="Open Source">Open Source & Community</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="circle-desc">Description *</label>
            <textarea id="circle-desc" class="form-control" rows="3" placeholder="Describe the purpose and activities of this circle..." required></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" data-modal-close>Cancel</button>
          <button type="submit" id="circle-submit-btn" class="btn btn-primary">Create Circle</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <div id="main-footer"></div>

  <!-- JavaScript dependencies -->
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  <script>
    let circlesList = [];

    document.addEventListener("DOMContentLoaded", () => {
      loadCircles();
    });

    async function loadCircles() {
      try {
        circlesList = await apiGet("/api/circles");
        renderCircles(circlesList);
      } catch (err) {
        document.getElementById("circles-grid").innerHTML = `
          <div class="card" style="grid-column: span 2; text-align: center; padding: 3rem;">
            <h3>Error loading circles</h3>
            <p style="color: var(--stone-brown);">${err.message}</p>
          </div>
        `;
      }
    }

    function renderCircles(list) {
      const grid = document.getElementById("circles-grid");
      if (!grid) return;

      if (!list || list.length === 0) {
        grid.innerHTML = `<div class="card" style="grid-column: span 2; text-align: center; padding: 3rem;">
          <h3>No circles found</h3>
          <p style="color: var(--stone-brown);">Create the first campus circle!</p>
        </div>`;
        return;
      }

      grid.innerHTML = list.map(c => `
        <div class="card card-interactive" data-circle-id="${c.id}" style="display: flex; flex-direction: column;">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.75rem;">
            <span class="badge badge-bordeaux">${c.category || 'General'}</span>
            <span style="font-size: 0.85rem; font-weight: 700; color: var(--night-bordeaux);">👥 ${c.memberCount || 1} Members</span>
          </div>

          <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.75rem;">
            <div style="font-size: 1.75rem;">${c.icon || '⚡'}</div>
            <h3 style="font-size: 1.25rem; color: var(--black);">${c.name}</h3>
          </div>

          <p style="color: var(--stone-brown); font-size: 0.9rem; margin-bottom: 1.25rem; line-height: 1.5;">
            ${c.description}
          </p>

          <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); padding-top: 0.85rem; margin-top: auto;">
            <span style="font-size: 0.825rem; color: var(--stone-brown);">Open Community</span>
            <button class="btn btn-sm btn-primary" onclick="joinCircle('${c.id}', '${c.name}')">
              Join Circle
            </button>
          </div>
        </div>
      `).join('');
    }

    function openCreateCircleModal() {
      if (!getAuthToken()) {
        showToast("Please sign in to create a circle.", "info");
        setTimeout(() => { window.location.href = "login.html"; }, 800);
        return;
      }
      document.getElementById("create-circle-modal").classList.add("show");
    }

    async function handleCreateCircle(e) {
      e.preventDefault();
      const name = document.getElementById("circle-name").value.trim();
      const category = document.getElementById("circle-cat").value;
      const description = document.getElementById("circle-desc").value.trim();
      const submitBtn = document.getElementById("circle-submit-btn");

      submitBtn.disabled = true;
      submitBtn.innerText = "Creating...";

      try {
        await apiPost("/api/circles", { name, category, description, icon: "🚀" });
        document.getElementById("create-circle-modal").classList.remove("show");
        showToast(`Circle '${name}' created!`, "success");
        loadCircles();
      } catch (err) {
        showToast(err.message || "Failed to create circle", "error");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Create Circle";
      }
    }

    async function joinCircle(id, name) {
      if (!getAuthToken()) {
        showToast("Please sign in to join circles.", "info");
        setTimeout(() => { window.location.href = "login.html"; }, 800);
        return;
      }

      try {
        await apiPost(`/api/circles/${id}/join`, {});
        showToast(`You have joined ${name}!`, "success");
        loadCircles();
      } catch (err) {
        showToast(err.message || "Failed to join circle", "info");
      }
    }
  </script>
</body>
</html>
