<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password – CampusConnect</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .auth-wrapper {
      max-width: 440px;
      margin: 3rem auto;
    }
  </style>
</head>
<body>

  <!-- Main Navigation Header -->
  <div id="main-nav"></div>

  <!-- Main Content Container -->
  <main class="main-content">
    <div class="auth-wrapper">
      <div class="card">
        <div style="text-align: center; margin-bottom: 2rem;">
          <h1 style="font-size: 1.8rem; color: var(--night-bordeaux); margin-bottom: 0.5rem;">Reset Your Password</h1>
          <p style="color: var(--stone-brown); font-size: 0.95rem;">Enter your university email address and we will send you a verification link.</p>
        </div>

        <form id="reset-form" onsubmit="handleReset(event)">
          <!-- University Email -->
          <div class="form-group">
            <label class="form-label" for="reset-email">University Email</label>
            <input type="email" id="reset-email" class="form-control" placeholder="student.name@campus.edu" required>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Send Reset Link</button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border-color); font-size: 0.9rem; color: var(--stone-brown);">
          Remembered your password? <a href="login.html" style="font-weight: 600;">Return to Sign In</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <div id="main-footer"></div>

  <!-- JavaScript dependencies -->
  <script src="js/mock-data.js"></script>
  <script src="js/main.js"></script>
  <script>
    function handleReset(e) {
      e.preventDefault();
      const email = document.getElementById("reset-email").value;
      showToast(`Password reset link sent to ${email}! Please check your inbox.`, "success");
      setTimeout(() => {
        window.location.href = "login.html";
      }, 2500);
    }
  </script>
</body>
</html>
