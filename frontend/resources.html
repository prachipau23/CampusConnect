<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resource Hub – CampusConnect</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Main Navigation Header -->
  <div id="main-nav"></div>

  <!-- Main Content Container -->
  <main class="main-content">

    <div class="page-header">
      <div>
        <h1 class="page-title">Campus Resource Hub</h1>
        <p class="page-subtitle">Revision guides, past exam papers, starter templates, and design kits shared by students.</p>
      </div>
      <button class="btn btn-primary" data-modal-target="upload-resource-modal">
        📤 Upload Shared Resource
      </button>
    </div>

    <!-- Filter Bar -->
    <div class="filter-bar">
      <div class="search-input-wrapper">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="res-search" class="form-control" placeholder="Search resource title, subject..." oninput="filterResources()">
      </div>

      <div style="min-width: 200px;">
        <select id="res-cat-filter" class="form-select" onchange="filterResources()">
          <option value="">All Categories</option>
          <option value="Cheatsheets & Guides">Cheatsheets & Guides</option>
          <option value="Exam Papers">Exam Papers</option>
          <option value="Design Kits">Design Kits</option>
          <option value="Boilerplates">Boilerplates</option>
        </select>
      </div>
    </div>

    <!-- Resource Cards Grid -->
    <div class="grid grid-cols-2" id="resources-grid">
      <!-- Populated via JS -->
    </div>

  </main>

  <!-- Upload Resource Modal -->
  <div class="modal-backdrop" id="upload-resource-modal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title">Upload Shared Student Resource</h3>
        <button class="modal-close" data-modal-close>&times;</button>
      </div>
      <form onsubmit="handleUploadResource(event)">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label">Resource Title *</label>
            <input type="text" id="res-title-input" class="form-control" placeholder="e.g. Spring Boot REST API Architecture Guide" required>
          </div>

          <div class="form-group">
            <label class="form-label">Category *</label>
            <select id="res-cat-select" class="form-select" required>
              <option value="Cheatsheets & Guides">Cheatsheets & Guides</option>
              <option value="Exam Papers">Exam Papers</option>
              <option value="Design Kits">Design Kits</option>
              <option value="Boilerplates">Boilerplates</option>
            </select>
          </div>

          <!-- File Upload Dropzone -->
          <div class="form-group">
            <label class="form-label">File Attachment *</label>
            <div class="dropzone" onclick="document.getElementById('res-file-input').click()">
              <div class="dropzone-icon">📁</div>
              <div style="font-weight: 700; font-size: 0.95rem; color: var(--black);" id="res-upload-status">Click to select PDF, ZIP, or Code archive</div>
              <div style="font-size: 0.8rem; color: var(--stone-brown);">Max file size: 25MB</div>
              <input type="file" id="res-file-input" style="display: none;" onchange="handleResFileSelect(event)">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" data-modal-close>Cancel</button>
          <button type="submit" class="btn btn-primary">Upload Resource</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <div id="main-footer"></div>

  <!-- JavaScript dependencies -->
  <script src="js/mock-data.js"></script>
  <script src="js/main.js"></script>
  <script>
    let resourcesList = getStoredData("resources", MOCK_DATA.resources);

    document.addEventListener("DOMContentLoaded", () => {
      renderResources(resourcesList);
    });

    function renderResources(list) {
      const grid = document.getElementById("resources-grid");
      if (!grid) return;

      if (list.length === 0) {
        grid.innerHTML = `<div class="card" style="grid-column: span 2; text-align: center; padding: 3rem;">
          <h3>No resources found</h3>
          <p style="color: var(--stone-brown);">Be the first to upload a resource for your peers!</p>
        </div>`;
        return;
      }

      grid.innerHTML = list.map(r => `
        <div class="card card-interactive" data-resource-id="${r.id}" style="display: flex; flex-direction: column;">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.75rem;">
            <span class="badge badge-bordeaux">${r.category}</span>
            <span class="badge badge-taupe">${r.format} (${r.size})</span>
          </div>

          <h3 style="font-size: 1.15rem; margin-bottom: 0.5rem; color: var(--black);">${r.title}</h3>

          <div style="font-size: 0.85rem; color: var(--stone-brown); margin-bottom: 1.25rem;">
            Uploaded by <strong>${r.uploader}</strong> (${r.dept}) • ${r.date}
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); padding-top: 0.85rem; margin-top: auto;">
            <span style="font-size: 0.825rem; color: var(--stone-brown);">📥 <strong id="dl-cnt-${r.id}">${r.downloads}</strong> Downloads</span>
            <button class="btn btn-sm btn-primary" onclick="downloadResource('${r.id}', '${r.title}')">
              ⬇️ Download File
            </button>
          </div>
        </div>
      `).join('');
    }

    function filterResources() {
      const search = document.getElementById("res-search").value.toLowerCase();
      const cat = document.getElementById("res-cat-filter").value;

      const filtered = resourcesList.filter(r => {
        const matchesSearch = r.title.toLowerCase().includes(search) || r.uploader.toLowerCase().includes(search);
        const matchesCat = !cat || r.category === cat;
        return matchesSearch && matchesCat;
      });

      renderResources(filtered);
    }

    let selectedFileName = "";
    function handleResFileSelect(e) {
      const file = e.target.files[0];
      if (file) {
        selectedFileName = file.name;
        document.getElementById("res-upload-status").innerText = `Selected: ${file.name}`;
      }
    }

    function handleUploadResource(e) {
      e.preventDefault();
      const title = document.getElementById("res-title-input").value;
      const cat = document.getElementById("res-cat-select").value;

      const newRes = {
        id: "res-" + Date.now(),
        title: title,
        category: cat,
        uploader: MOCK_DATA.currentUser.name,
        dept: MOCK_DATA.currentUser.department,
        downloads: 1,
        format: selectedFileName ? selectedFileName.split('.').pop().toUpperCase() : "PDF",
        size: "3.5 MB",
        date: new Date().toISOString().split('T')[0]
      };

      resourcesList.unshift(newRes);
      setStoredData("resources", resourcesList);
      renderResources(resourcesList);

      document.getElementById("upload-resource-modal").classList.remove("show");
      showToast("Resource uploaded successfully to campus library!", "success");
    }

    function downloadResource(id, title) {
      const item = resourcesList.find(r => r.id === id);
      if (item) {
        item.downloads += 1;
        setStoredData("resources", resourcesList);
        document.getElementById(`dl-cnt-${id}`).innerText = item.downloads;
        showToast(`Downloading file: "${title}"`, "success");
      }
    }
  </script>
</body>
</html>
