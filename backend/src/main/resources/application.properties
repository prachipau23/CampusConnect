# Server
server.port=${PORT:8080}

# JSP view resolver
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Database (overridden by env vars in prod)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/campusconnect}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:campusconnect}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:campusconnect}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET:CampusConnectSuperSecretKey2024MustBe256BitsLongAtLeast32Chars}
jwt.expiration-ms=86400000

# CORS — frontend origin
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:3000}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Seed data (set to true on first deploy, then flip to false)
seed.enabled=${SEED_ENABLED:false}

# Multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
