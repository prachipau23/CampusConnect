# Server — bind to all network interfaces, default to Render's port 10000
server.address=0.0.0.0
server.port=${PORT:10000}

# JSP view resolver
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Database (standard PostgreSQL JDBC URL format)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://dpg-da5gejrncjis738rmhsg-a/campusconnect_qzaj}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:campusconnect}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:h19cITsrN3NOHNf8HFRlR6OpjJfzElgT}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# HikariCP pool optimization
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.initialization-fail-timeout=-1

# JWT
jwt.secret=${JWT_SECRET:CampusConnectSuperSecretKey2024MustBe256BitsLongAtLeast32Chars}
jwt.expiration-ms=86400000

# CORS — frontend origin
app.cors.allowed-origin=${FRONTEND_ORIGIN:https://campusconnect-frontend.vercel.app}

# Actuator
management.endpoints.web.exposure.include=health,info

# Seed data (set to true on first deploy, then flip to false)
seed.enabled=${SEED_ENABLED:true}

# Multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
